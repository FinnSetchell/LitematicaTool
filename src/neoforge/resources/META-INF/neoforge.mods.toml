modLoader = "javafml"
loaderVersion = "${neoforge_range}"
license = "${license}"
issueTrackerURL = "https://github.com/FinnSetchell/LitematicaTool/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
${neo_icon_key} = "assets/${mod_id}/icon.png"
credits = "${credits}"
authors = "${mod_author}"
description = '''${description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_min}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${mc_compat}"
ordering = "NONE"
side = "BOTH"
