# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=2.0.0
group=com.finndog
java_version=25

# Common
minecraft_version=26.3
mod_name=LitematicaTool
mod_author=FinnDog
mod_id=litematicatool
license=CC0-1.0
credits=
description=A simple tool designed to work with Litematica for enhanced schematic management.
minecraft_version_range=[26.3,26.4)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.161.0+26.3
fabric_loader_version=0.19.5
# Fabric MC dependency uses Fabric/SemVer syntax (not Maven). Update when bumping minecraft_version_range.
fabric_mc_dependency=>=26.3 <26.4

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.3.0.7-beta
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Alpha publish mode.
# When true: CurseForge + Modrinth uploads are marked ALPHA, the GitHub release
# is created as pre-release, Discord announcement goes to the alpha channel.
alphaBuild=false

# Discord announcement settings
discordPing=false
discord_avatar_url=
discord_banner_url=
discord_role_id=
discordEmbedColor=

# Publish / Discord announcement properties
branchName=26.3.0
publishMcStart=26.3
publishMcEnd=26.3
publishExtraMcVersions=
publishDisplayPrefix=LitematicaTool
publishDisplaySuffix=[Fabric + NeoForge]
modrinthProjectId=n6d6agCA
modrinthProjectSlug=litematica-tool
curseforgeProjectId=494413
curseforgeProjectSlug=litematica-tool
