plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'me.modmuss50.mod-publish-plugin' version '0.8.4'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

def changeLog = rootProject.file("CHANGELOG.md")
def changelogContent = changeLog.exists() ? changeLog.getText('UTF-8') : ''
def changelogMatcher = ~/(?s)## \[${project.version}\] - \d{4}-\d{2}-\d{2}\r?\n(.*?)(?=\r?\n---|\r?\n## \[|\z)/
def changelogMatch = (changelogContent =~ changelogMatcher)
def changelogLatest = changelogMatch.find() ? changelogMatch.group(1).trim() : ''

def isAlpha = project.findProperty('alphaBuild')?.toString()?.toBoolean() ?: false
def displayPrefix = project.findProperty('publishDisplayPrefix') ?: 'LitematicaTool'

publishMods {
    file = tasks.remapJar.archiveFile
    changelog = changelogLatest
    version = project.version.toString()
    type = isAlpha ? ALPHA : STABLE
    displayName = "${displayPrefix} ${project.version}-${minecraft_version} (Fabric)"
    modLoaders.add("fabric")
    dryRun = false
    maxRetries = 3

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_API_KEY')
        projectId = (project.findProperty('modrinthProjectId') ?: '')
        minecraftVersionRange {
            start = project.findProperty('publishMcStart')
            end = project.findProperty('publishMcEnd')
        }
        def extra = (project.findProperty('publishExtraMcVersions') ?: '').toString().trim()
        if (extra) {
            extra.split(',').each { v -> if (v.trim()) minecraftVersions.add(v.trim()) }
        }
    }

    curseforge {
        accessToken = providers.environmentVariable('CURSEFORGE_API_KEY')
        projectId = (project.findProperty('curseforgeProjectId') ?: '')
        projectSlug = (project.findProperty('curseforgeProjectSlug') ?: '')
        serverRequired = true
        minecraftVersionRange {
            start = project.findProperty('publishMcStart')
            end = project.findProperty('publishMcEnd')
        }
        def extra = (project.findProperty('publishExtraMcVersions') ?: '').toString().trim()
        if (extra) {
            extra.split(',').each { v -> if (v.trim()) minecraftVersions.add(v.trim()) }
        }
    }
}
