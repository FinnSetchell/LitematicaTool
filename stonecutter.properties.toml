# Per-node values. Mod metadata that never varies stays in gradle.properties.
# Tables are picked per node by `properties { tags(version, loader) }` in stonecutter.gradle.kts, so
# `deps.fabric_api` resolves to whatever the matching [fabric."<version>"] table declares.
#
# A node's version (the table name) is what `//? if` conditions compare against. mod.mc_build is the
# Minecraft version it compiles against, which is usually the same but not always: where a loader
# skipped a release, that loader's node compiles against the next one in the range.
# mod.mc_compat is the range the jar declares, in each loader's own syntax.
#
# deps.neoforge is the build this node compiles and runs against in dev, and should be a current
# release of its line. deps.neoforge_min is the looser runtime floor the jar declares, so users on
# an earlier build are not locked out. Do not pin deps.neoforge to the first beta of a line: the
# earliest 26.3 builds crash MixinExtras 0.5.4 during mod construction, which breaks any dev-client
# test harness that uses mixins, even though this mod has none of its own.
# mod.recipe picks the recipe folder and format under src/main/recipe; the shape changed four times
# between 1.20 and 1.21.2 and a file in the wrong shape is ignored without an error in game.

# Loom for the obfuscated versions, applied by dev.kikugie.loom-back-compat.
loomx.loom_version = "1.17-SNAPSHOT"

# ------------------------------------------------------------------ 1.20-1.20.4 (Java 17)
["1.20"]
mod.java = "17"
# data/<ns>/recipes/, result "item", ingredient object.
mod.recipe = "1.20"

[fabric."1.20"]
mod.mc_build = "1.20"
mod.mc_compat = ">=1.20 <1.20.5"
mod.fabric_loader_dep = ">=0.14.25"
deps.fabric_loader = "0.14.25"
deps.fabric_api = "0.83.0+1.20"

# Built by build.forge-legacy.gradle.kts: Forge before 1.20.5 needs a reobfuscated jar.
[forge."1.20"]
mod.mc_build = "1.20"
mod.mc_compat = "[1.20,1.20.5)"
deps.forge = "46.0.14"
deps.forge_range = "[46,)"

# No NeoForge node: NeoForge starts at 1.20.2, so it cannot cover this range's 1.20 and 1.20.1.

# ------------------------------------------------------------------ 1.20.5-1.20.6 (Java 21)
["1.20.6"]
mod.java = "21"
# 1.20.5 moved the result key from "item" to "id". Folder and ingredient unchanged.
mod.recipe = "1.20.5"

[fabric."1.20.6"]
mod.mc_build = "1.20.6"
mod.mc_compat = ">=1.20.5 <1.20.7"
mod.fabric_loader_dep = ">=0.15.0"
deps.fabric_loader = "0.15.10"
deps.fabric_api = "0.98.0+1.20.6"

# Forge has no 1.20.5 build at all, so this covers 1.20.6 only.
[forge."1.20.6"]
mod.mc_build = "1.20.6"
mod.mc_compat = "[1.20.6,1.20.7)"
deps.forge = "50.2.15"
deps.forge_range = "[50,)"

[neoforge."1.20.6"]
mod.mc_build = "1.20.6"
mod.mc_compat = "[1.20.6,1.20.7)"
mod.neo_icon_key = "logoFile"
deps.neoforge = "20.6.139"
deps.neoforge_min = "20.6.0-beta"
deps.neoforge_range = "[2,)"

# ------------------------------------------------------------------ 1.21-1.21.1 (Java 21)
