plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin' version '0.8.4'
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file("runs/client"))
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file("runs/data"))
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            this.file("runs/server").createParentDirectories()
            gameDirectory = this.mkdir(this.file("runs/server"))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

def changeLog = rootProject.file("CHANGELOG.md")
def changelogContent = changeLog.exists() ? changeLog.getText('UTF-8') : ''
def changelogMatcher = ~/(?s)## \[${project.version}\] - \d{4}-\d{2}-\d{2}\r?\n(.*?)(?=\r?\n---|\r?\n## \[|\z)/
def changelogMatch = (changelogContent =~ changelogMatcher)
def changelogLatest = changelogMatch.find() ? changelogMatch.group(1).trim() : ''

def isAlpha = project.findProperty('alphaBuild')?.toString()?.toBoolean() ?: false
def displayPrefix = project.findProperty('publishDisplayPrefix') ?: 'LitematicaTool'

publishMods {
    file = tasks.jar.archiveFile
    changelog = changelogLatest
    version = project.version.toString()
    type = isAlpha ? ALPHA : STABLE
    displayName = "${displayPrefix} ${project.version}-${minecraft_version} (NeoForge)"
    modLoaders.add("neoforge")
    dryRun = false
    maxRetries = 3

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_API_KEY')
        projectId = (project.findProperty('modrinthProjectId') ?: '')
        minecraftVersionRange {
            start = project.findProperty('publishMcStart')
            end = project.findProperty('publishMcEnd')
        }
        def extra = (project.findProperty('publishExtraMcVersions') ?: '').toString().trim()
        if (extra) {
            extra.split(',').each { v -> if (v.trim()) minecraftVersions.add(v.trim()) }
        }
    }

    curseforge {
        accessToken = providers.environmentVariable('CURSEFORGE_API_KEY')
        projectId = (project.findProperty('curseforgeProjectId') ?: '')
        projectSlug = (project.findProperty('curseforgeProjectSlug') ?: '')
        serverRequired = true
        minecraftVersionRange {
            start = project.findProperty('publishMcStart')
            end = project.findProperty('publishMcEnd')
        }
        def extra = (project.findProperty('publishExtraMcVersions') ?: '').toString().trim()
        if (extra) {
            extra.split(',').each { v -> if (v.trim()) minecraftVersions.add(v.trim()) }
        }
    }
}
